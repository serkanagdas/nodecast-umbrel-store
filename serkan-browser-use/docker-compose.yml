version: "3.7"

services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: serkan-browser-use_server_1
      APP_PORT: 7788

  server:
    # Built from browser-use/web-ui v3.0.0 (upstream publishes no prebuilt
    # version-tagged image, so we pin the source release and let umbrel build).
    # If builds are too slow on your device, a prebuilt community image can be
    # swapped in here later.
    build:
      context: https://github.com/browser-use/web-ui.git#v3.0.0
      dockerfile: Dockerfile
      args:
        TARGETPLATFORM: linux/amd64
    image: serkan-browser-use:3.0.0
    restart: on-failure
    init: true
    environment:
      # LLM keys are entered in the WebUI settings after install;
      # these endpoints just pre-fill the defaults.
      - OPENAI_ENDPOINT=https://api.openai.com/v1
      - ANTHROPIC_ENDPOINT=https://api.anthropic.com
      - OLLAMA_ENDPOINT=http://localhost:11434
      - ANONYMIZED_TELEMETRY=false
      - BROWSER_USE_LOGGING_LEVEL=info
      # Browser settings
      - BROWSER_DEBUGGING_PORT=9222
      - BROWSER_DEBUGGING_HOST=localhost
      - USE_OWN_BROWSER=false
      - KEEP_BROWSER_OPEN=true
      # Display (VNC live view inside container)
      - DISPLAY=:99
      - PLAYWRIGHT_BROWSERS_PATH=/ms-browsers
      - RESOLUTION=1920x1080x24
      - VNC_PASSWORD=umbrel
    volumes:
      # Chromium profile + downloads persist across app updates
      - ${APP_DATA_DIR}/data/chrome_data:/app/data/chrome_data
      - ${APP_DATA_DIR}/data/downloads:/app/downloads
    shm_size: "2gb"
    cap_add:
      # Chromium sandbox inside container
      - SYS_ADMIN
    tmpfs:
      - /tmp
