manifestVersion: 1
id: serkan-mobilerun
name: Mobilerun
tagline: AI mobile agent framework to control Android devices
icon: https://raw.githubusercontent.com/serkanagdas/serkan-umbrel-store/main/serkan-mobilerun/icon.svg
category: AI
version: "0.7.4"
port: 8765
description: >-
  Mobilerun is an LLM-powered mobile automation framework that allows
  agents and users to control real Android and iOS devices using natural
  language. Inspect UI state, tap, swipe, type, capture screenshots and
  automate complex workflows.

  This package provides a web dashboard and REST API on your Umbrel to
  connect to your Android devices over ADB (USB or Wi-Fi/Tailscale,
  such as a Galaxy Note 4). Connect your devices, configure your LLM
  API key (Gemini, OpenAI, Anthropic, or Ollama) and trigger mobile
  automations from the web UI or via OpenBot agents.

