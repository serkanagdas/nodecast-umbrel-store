name: Check upstream updates

# Checks each packaged app's upstream releases. When a newer version is
# found, opens (or updates) a PR bumping the compose image tag and the
# umbrel-app.yml version. Merge the PR and umbrelOS shows "Update available".
#
# Tag source per app:
# - openbot:      GitHub releases (v0.49.0) -> GHCR image tag v0.49.0 exists (keep v)
# - nodecast-tv:  GitHub releases (v2.2.1)  -> GHCR image tag 1.4.3 style (strip v)
# - stremio:      GitHub releases           -> Docker Hub plain tags (strip v)
# NOTE: Stremio/server has no GitHub releases endpoint entry that works with
#       /releases/latest reliably for every repo; if it 404s the job for that
#       app fails harmlessly (fail-fast: false). Fallback: bump manually.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: serkan-openbot
            repo: nightly-labs/openbot
            image: ghcr.io/nightly-labs/openbot
            strip_v: false
          - dir: serkan-nodecast-tv
            repo: technomancer702/nodecast-tv
            image: ghcr.io/technomancer702/nodecast-tv
            strip_v: true
          - dir: serkan-stremio-server
            repo: Stremio/server
            image: stremio/server
            strip_v: true
    steps:
      - name: Checkout store repo
        uses: actions/checkout@v4

      - name: Get latest upstream release
        id: upstream
        run: |
          TAG="$(curl -sSf "https://api.github.com/repos/${{ matrix.repo }}/releases/latest" | jq -r .tag_name)"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No releases found for ${{ matrix.repo }}"; exit 1
          fi
          if [ "${{ matrix.strip_v }}" = "true" ]; then
            VERSION="${TAG#v}"
          else
            VERSION="$TAG"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream latest: $TAG -> image tag: $VERSION"

      - name: Compare with packaged version
        id: cmp
        run: |
          CURRENT="$(grep -m1 '^version:' ${{ matrix.dir }}/umbrel-app.yml | sed 's/version: *"\?//;s/"\?//')"
          echo "Packaged: $CURRENT / Upstream image tag: ${{ steps.upstream.outputs.version }}"
          if [ "$CURRENT" = "${{ steps.upstream.outputs.version }}" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip note
        if: steps.cmp.outputs.update != 'true'
        run: echo "${{ matrix.dir }} is up to date (image ${{ steps.upstream.outputs.version }})"

      - name: Bump files
        if: steps.cmp.outputs.update == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          sed -i "s|^version: .*|version: \"${VERSION}\"|" ${{ matrix.dir }}/umbrel-app.yml
          sed -i "s|^\(\s*image: ${{ matrix.image }}:\).*|\1${VERSION}|" ${{ matrix.dir }}/docker-compose.yml
          # releaseNotes: single-line value on the line after "releaseNotes: >-"
          sed -i "/^releaseNotes: >-/{n;s/.*/  Upstream release ${TAG}./}" ${{ matrix.dir }}/umbrel-app.yml

      - name: Create Pull Request
        if: steps.cmp.outputs.update == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          branch: "update/${{ matrix.dir }}"
          delete-branch: true
          title: "Update ${{ matrix.dir }} to ${{ steps.upstream.outputs.version }}"
          body: |
            Upstream `${{ matrix.repo }}` released `${{ steps.upstream.outputs.tag }}`.

            Bumps:
            - `${{ matrix.dir }}/docker-compose.yml` image tag
            - `${{ matrix.dir }}/umbrel-app.yml` version + releaseNotes

            **Merge this PR, then umbrelOS → App Store → Update.**
          commit-message: "chore(${{ matrix.dir }}): bump to ${{ steps.upstream.outputs.version }}"
