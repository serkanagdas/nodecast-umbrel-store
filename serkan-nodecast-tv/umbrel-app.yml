manifestVersion: 1
id: serkan-nodecast-tv
name: NodeCast TV
tagline: Self-hosted IPTV player for Xtream Codes and M3U providers
icon: https://raw.githubusercontent.com/technomancer702/nodecast-tv/main/public/img/logo-banner.png
category: Media
version: "1.4.3"
port: 3000
description: >-
  Modern web-based IPTV player featuring Live TV, EPG, Movies (VOD) and
  Series support. Built for large playlists (7000+ channels) with virtual
  scrolling, virtualized channel zapping and a 24h interactive TV guide.
  Connects to any Xtream Codes provider or M3U playlist. Includes
  multi-user auth (admin/viewer roles), favorites, and smart remux/transcode
  stream handling.

