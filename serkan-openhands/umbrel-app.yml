description: >-
  OpenHands (formerly OpenDevin) is an autonomous AI software
  engineering agent. Write code, run commands, browse the web and
  build software from a browser-based chat interface. Connects to
  your preferred LLM provider (Claude, GPT, local models via
  Ollama/LM Studio, etc.). Mounts your umbrel Workspace so the
  agent can work directly on your Projects and Obsidian vault.

