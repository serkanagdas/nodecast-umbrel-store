version: "3.7"

services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      # NOTE: OpenBot publishes no web UI; this proxy exists only because
      # umbrel requires one. Open the app via desktop/phone client instead.
      APP_HOST: serkan-openbot_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/nightly-labs/openbot:0.49.0
    restart: on-failure
    init: true
    security_opt:
      # The upstream custom seccomp profile can't ship inside umbrel's
      # compose system, so we unconfine seccomp to allow the Electron
      # sandbox user namespaces. no-new-privileges stays on as a guard.
      - seccomp=unconfined
      - no-new-privileges:true
    # Chromium uses shared memory; the Docker default of 64 MB is too small.
    shm_size: 1g
    # OpenBot stops its agents and closes the database before it exits.
    stop_grace_period: 60s
    volumes:
      # All OpenBot data (db, keyring, provider sign-ins, agent workspaces).
      # Must stay one unit — the encrypted data needs the keyring beside it.
      - ${APP_DATA_DIR}/data:/data
